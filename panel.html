<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0709">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LEGACY PANEL</title>
<style>
:root{
  --bg:#090708;--bg2:#120c0f;--card:#171013;--line:#3a1a26;
  --wine:#862d49;--wine2:#a8385a;--rose:#e6a2b5;--txt:#f4eef0;
  --mut:#a89aa0;--ok:#5fbf8a;--bad:#e5677d;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;height:100%}
body{
  min-height:100%;background:var(--bg);color:var(--txt);
  font:16px/1.6 -apple-system,"SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif;
  overscroll-behavior-y:none;
}
[hidden]{display:none!important}
.boot{
  position:fixed;inset:0;display:grid;place-items:center;
  color:var(--rose);font-weight:800;letter-spacing:3px;
  padding:20px;text-align:center;
}
.top{
  position:fixed;top:0;inset-inline:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-t) + 8px) calc(var(--safe-r) + 12px) 8px calc(var(--safe-l) + 12px);
  background:rgba(9,7,8,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.brand{color:var(--rose);font-weight:800;letter-spacing:2px}
.brand.big{font-size:20px;padding:6px 8px 18px}
.icon{
  min-width:44px;height:44px;border:1px solid var(--line);
  border-radius:12px;background:var(--bg2);color:var(--txt);
  font-size:15px;cursor:pointer;
}
.side{
  position:fixed;z-index:30;top:0;bottom:0;inset-inline-start:0;
  width:272px;max-width:82vw;background:var(--bg2);
  border-inline-end:1px solid var(--line);
  padding:calc(var(--safe-t) + 16px) 14px calc(var(--safe-b) + 16px);
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .22s;
}
[dir=ltr] .side{transform:translateX(-100%)}
.side.open{transform:none}
.scrim{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.6);display:none}
.scrim.open{display:block}
nav{display:flex;flex-direction:column;gap:6px;flex:1;overflow:auto}
nav button{
  display:flex;align-items:center;gap:12px;min-height:48px;
  padding:0 14px;border:0;border-radius:12px;background:none;
  color:var(--mut);font:inherit;font-weight:600;text-align:start;cursor:pointer;
}
nav button.on{background:linear-gradient(135deg,#5a1d31,var(--wine));color:#fff}
.who{
  display:flex;flex-direction:column;gap:6px;padding:12px 8px;
  border-top:1px solid var(--line);font-size:13px;color:var(--mut);word-break:break-all;
}
.pill{
  align-self:flex-start;padding:2px 10px;border-radius:99px;
  background:#351522;color:var(--rose);font-size:12px;font-weight:700;
}
.dev{font-size:12px;color:#7a6a71;padding:0 8px}
main{
  padding:calc(var(--safe-t) + 74px) calc(var(--safe-r) + 16px) calc(var(--safe-b) + 32px) calc(var(--safe-l) + 16px);
  max-width:1000px;margin:auto;
}
h2{font-size:22px;margin-bottom:16px}
h3{font-size:16px;color:var(--rose);margin-bottom:10px}
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:18px;margin-bottom:12px;
}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.grid .card{margin:0}
.num{font-size:30px;font-weight:800;color:#fff;line-height:1.2}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{
  min-height:44px;padding:0 18px;border:0;border-radius:11px;
  background:var(--wine);color:#fff;font:inherit;font-weight:700;cursor:pointer;
}
.btn:active{background:var(--wine2)}
.btn.ghost{background:#21151a;border:1px solid var(--line)}
.btn.bad{background:#5a1a26}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.notice{
  background:linear-gradient(135deg,#2a1520,#1a0f15);
  border:1px solid var(--wine);border-radius:16px;padding:20px;margin-bottom:16px;
  line-height:1.8;
}
.notice strong{color:var(--rose)}
.toast{
  position:fixed;inset-inline:16px;bottom:calc(var(--safe-b) + 16px);z-index:50;
  max-width:420px;margin:auto;padding:12px 16px;border-radius:12px;
  background:#2a1019;border:1px solid var(--wine);text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.toast.show{opacity:1}
@media(min-width:900px){
  .top{display:none}
  .side{transform:none!important;inset-inline-start:0}
  main{margin-inline-start:296px;margin-inline-end:auto;padding-top:32px}
  .scrim{display:none!important}
}
</style>
</head>
<body>
<div id="boot" class="boot">LEGACY PANEL</div>

<div id="app" hidden>
  <header class="top">
    <button id="menuBtn" class="icon" aria-label="menu">☰</button>
    <div class="brand">LEGACY PANEL</div>
    <button id="langBtn" class="icon">EN</button>
  </header>

  <aside id="side" class="side">
    <div class="brand big">LEGACY PANEL</div>
    <nav id="nav"></nav>
    <div class="who">
      <span id="whoMail"></span>
      <span id="whoRole" class="pill">USER</span>
    </div>
    <div class="dev">Developed by Larry</div>
  </aside>

  <div id="scrim" class="scrim"></div>
  <main id="view"></main>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://urjcoeyuxuwfmgwogeta.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ERmbRp1Vu9TuWRZThP3ZuA_TsAtMgCJ';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let lang = localStorage.getItem('lp_lang') || 'ar';
let page = 'dash';
let userEmail = '';

const T = {
  ar: {
    dash: 'لوحة التحكم',
    bots: 'إدارة البوتات',
    console: 'الكونسول',
    files: 'مدير الملفات',
    res: 'الموارد',
    settings: 'إعدادات الحساب',
    logout: 'تسجيل الخروج',
    welcome: 'مرحباً بك',
    offlineTitle: 'الخادم الخلفي قيد التطوير',
    offlineMsg: 'تم تسجيل دخولك بنجاح. الواجهة جاهزة، لكن الخادم الذي يشغّل البوتات ويدير الملفات لم يُربط بعد. سنكمل بناءه في الخطوات القادمة.',
    email: 'البريد الإلكتروني',
    role: 'الصلاحية',
    status: 'الحالة',
    online: 'متصل (جلسة نشطة)',
    backend: 'الخادم الخلفي',
    notReady: 'غير متصل بعد',
    next: 'الخطوة القادمة',
    nextMsg: 'سنبدأ بربط قاعدة البيانات وبناء واجهة إدارة البوتات خطوة بخطوة.',
  },
  en: {
    dash: 'Dashboard',
    bots: 'Bot Manager',
    console: 'Console',
    files: 'File Manager',
    res: 'Resources',
    settings: 'Account Settings',
    logout: 'Log out',
    welcome: 'Welcome',
    offlineTitle: 'Backend under development',
    offlineMsg: 'You are logged in successfully. The interface is ready, but the server that runs bots and manages files is not connected yet. We will build it in the next steps.',
    email: 'Email',
    role: 'Role',
    status: 'Status',
    online: 'Active session',
    backend: 'Backend server',
    notReady: 'Not connected yet',
    next: 'Next step',
    nextMsg: 'We will start connecting the database and building the bot management interface step by step.',
  }
};

const t = (k) => T[lang][k] || k;

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  $('#langBtn').textContent = lang === 'ar' ? 'EN' : 'ع';
}

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}

function closeMenu() {
  $('#side').classList.remove('open');
  $('#scrim').classList.remove('open');
}

function nav() {
  const items = [
    { id: 'dash', icon: '◈' },
    { id: 'bots', icon: '⬢' },
    { id: 'console', icon: '▤' },
    { id: 'files', icon: '▦' },
    { id: 'res', icon: '◔' },
    { id: 'settings', icon: '⚙' },
  ];
  $('#nav').innerHTML = items.map(i =>
    `<button data-p="${i.id}" class="${i.id === page ? 'on' : ''}">
      <span>${i.icon}</span>${t(i.id)}
    </button>`
  ).join('');

  $('#nav').querySelectorAll('button').forEach(b => {
    b.onclick = () => go(b.dataset.p);
  });

  $('#whoMail').textContent = userEmail;
  $('#whoRole').textContent = 'USER';
}

function go(p) {
  page = p;
  closeMenu();
  nav();
  render();
}

function render() {
  if (page === 'settings') {
    $('#view').innerHTML = `
      <h2>${t('settings')}</h2>
      <div class="card">
        <h3>${t('email')}</h3>
        <div class="mut" dir="ltr" style="margin-bottom:14px">${esc(userEmail)}</div>
        <button class="btn bad" id="logoutBtn">${t('logout')}</button>
      </div>
    `;
    $('#logoutBtn').onclick = async () => {
      await sb.auth.signOut();
      location.href = 'auth.html';
    };
    return;
  }

  // باقي الصفحات حالياً تعرض نفس الرسالة التوضيحية
  $('#view').innerHTML = `
    <h2>${t('dash')}</h2>

    <div class="notice">
      <strong>${t('offlineTitle')}</strong><br>
      ${t('offlineMsg')}
    </div>

    <div class="grid">
      <div class="card">
        <div class="mut">${t('email')}</div>
        <div class="num" style="font-size:16px;margin-top:8px;word-break:break-all" dir="ltr">${esc(userEmail)}</div>
      </div>
      <div class="card">
        <div class="mut">${t('status')}</div>
        <div class="num" style="font-size:18px;margin-top:8px;color:var(--ok)">${t('online')}</div>
      </div>
      <div class="card">
        <div class="mut">${t('backend')}</div>
        <div class="num" style="font-size:18px;margin-top:8px;color:var(--bad)">${t('notReady')}</div>
      </div>
    </div>

    <div class="card">
      <h3>${t('next')}</h3>
      <p class="mut">${t('nextMsg')}</p>
    </div>
  `;
}

// أحداث القائمة واللغة
$('#menuBtn').onclick = () => {
  $('#side').classList.add('open');
  $('#scrim').classList.add('open');
};
$('#scrim').onclick = closeMenu;
$('#langBtn').onclick = () => {
  lang = lang === 'ar' ? 'en' : 'ar';
  localStorage.setItem('lp_lang', lang);
  applyLang();
  nav();
  render();
};

// البدء
(async () => {
  applyLang();

  const { data } = await sb.auth.getSession();
  if (!data.session) {
    location.href = 'auth.html';
    return;
  }

  userEmail = data.session.user.email || '—';

  $('#boot').hidden = true;
  $('#app').hidden = false;
  nav();
  go('dash');
})();
</script>
</body>
</html>
