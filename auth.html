
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEGACY PANEL</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 padding:20px;background:#090708;color:white;
 font-family:Arial,sans-serif
}
.card{
 width:100%;max-width:420px;padding:32px 24px;
 background:#171013;border:1px solid #57202f;
 border-radius:18px;box-shadow:0 15px 60px #000
}
.logo{text-align:center;color:#bd526f;font-size:28px;
 font-weight:bold;letter-spacing:2px}
.sub{text-align:center;color:#aaa;margin:12px 0 28px}
.tabs{display:flex;gap:10px;margin-bottom:20px}
button{
 cursor:pointer;border:0;border-radius:9px;
 color:white;font-weight:bold
}
.tabs button{
 flex:1;padding:12px;background:#21151a;
 border:1px solid #57202f
}
.tabs button.active,.submit{background:#862d49}
input{
 width:100%;padding:14px;margin:8px 0;
 border:1px solid #49303a;border-radius:9px;
 background:#0d0a0c;color:white
}
.submit{width:100%;padding:14px;margin-top:15px;font-size:16px}
button:disabled{opacity:.5}
#message{
 text-align:center;margin-top:18px;
 color:#e6a2b5;font-size:14px;line-height:1.7
}
.footer{text-align:center;color:#777;font-size:12px;margin-top:25px}
</style>
</head>
<body>
<div class="card">
 <div class="logo">LEGACY PANEL</div>
 <div class="sub">منصة إدارة البوتات الخاصة بك</div>

 <div class="tabs">
  <button id="loginTab" class="active" type="button">تسجيل الدخول</button>
  <button id="signupTab" type="button">إنشاء حساب</button>
 </div>

 <form id="authForm">
  <input id="email" type="email" placeholder="البريد الإلكتروني" required>
  <input id="password" type="password" placeholder="كلمة المرور" minlength="6" required>
  <button id="submitBtn" class="submit" type="submit">دخول إلى المنصة</button>
 </form>

 <div id="message" role="status"></div>
 <div class="footer">LEGACY PANEL © 2026 — Developed by Larry</div>
</div>

<script type="module">
import { createClient } from
'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL =
'https://urjcoeyuxuwfmgwogeta.supabase.co';

const SUPABASE_KEY =
'sb_publishable_ERmbRp1Vu9TuWRZThP3ZuA_TsAtMgCJ';

const client = createClient(SUPABASE_URL,SUPABASE_KEY);

let mode='login';

const loginTab=document.getElementById('loginTab');
const signupTab=document.getElementById('signupTab');
const submitBtn=document.getElementById('submitBtn');
const message=document.getElementById('message');

function setMode(next){
 mode=next;
 loginTab.classList.toggle('active',mode==='login');
 signupTab.classList.toggle('active',mode==='signup');
 submitBtn.textContent=mode==='login'?'دخول إلى المنصة':'إنشاء الحساب';
 message.textContent='';
}

loginTab.onclick=()=>setMode('login');
signupTab.onclick=()=>setMode('signup');

document.getElementById('authForm').onsubmit=async(e)=>{
 e.preventDefault();

 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;

 if(SUPABASE_KEY==='ضع_PUBLISHABLE_KEY_هنا'){
  message.textContent='أضف Publishable Key داخل الكود أولاً.';
  return;
 }

 submitBtn.disabled=true;
 message.textContent='جارٍ الاتصال بـ LEGACY PANEL...';

 try{
  let result;

  if(mode==='signup'){
   result=await client.auth.signUp({email,password});
  }else{
   result=await client.auth.signInWithPassword({email,password});
  }

  if(result.error){
   message.textContent='خطأ: '+result.error.message;
  }else if(mode==='signup'){
   message.textContent=result.data.session
    ?'تم إنشاء الحساب بنجاح!'
    :'تم إنشاء الحساب! تحقق من بريدك إذا طُلب منك ذلك.';
  }else{
   message.textContent='تم تسجيل الدخول بنجاح!';
  }

 }catch(error){
  message.textContent='خطأ في الاتصال: '+(error.message||String(error));
 }finally{
  submitBtn.disabled=false;
 }
};
</script>
</body>
</html>
